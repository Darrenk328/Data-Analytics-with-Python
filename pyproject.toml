[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "skyscope"
version = "0.1.0"
description = "SkyScope: Heat & Takeoff — explore the world's airports and how a warming climate limits takeoff weight."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Darren Kapturski" }]
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "prompt_toolkit>=3.0.43",
    "pandas>=2.0",
    "numpy>=1.24",
    "rapidfuzz>=3.0",
    "httpx>=0.27",
    "platformdirs>=4.0",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
charts = ["plotext>=5.2"]
dev = ["pytest>=8", "ruff>=0.5", "plotext>=5.2"]

[project.scripts]
skyscope = "skyscope.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
skyscope = ["perf/aircraft.toml", "snapshot/*", "snapshot/climate/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501", "B008", "SIM108"]
