# SkyScope aircraft table — inputs to an EDUCATIONAL takeoff model, not flight-manual data.
#
# Fields
#   mtow_kg         maximum takeoff weight
#   oew_kg          operating empty weight (typical)
#   max_payload_kg  structural max payload (MZFW − OEW unless published directly)
#   tofl_ref_m      takeoff field length at MTOW, sea level, ISA, dry runway
#   flat_rate_dc    engines hold full thrust up to ISA + this many °C (MODEL ASSUMPTION)
#   thrust_lapse    fraction of thrust lost per °C above the flat-rating point (MODEL ASSUMPTION)
#   max_oat_c       max certified takeoff temperature — omitted: none could be confirmed
#   approx = true   at least one weight/length value could not be confirmed in a source
#                   document; the UI shows "≈" next to that type's results.
#
# flat_rate_dc / thrust_lapse are the plan's documented defaults (15 °C, 1 %/°C) for every
# type; they are modelling assumptions, not manufacturer numbers. Research notes behind each
# row are in the comments; see also NOTES.md.

